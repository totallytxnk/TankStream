<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TankStream Receiver</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    video { width: 100%; background: #111; border-radius: 8px; }
    textarea { width: 100%; height: 140px; font-family: monospace; font-size: 12px; }
    button { padding: 10px 18px; margin: 10px 0; cursor: pointer; }
    h3 { margin-top: 24px; }
  </style>
</head>
<body>
  <h1>TankStream Receiver</h1>
  <video id="video" autoplay playsinline muted></video>

  <h3>1. Paste the SDP offer from tankstream.exe</h3>
  <textarea id="offer" placeholder="Paste the full SDP offer here..."></textarea>
  <br>
  <button id="apply">Apply Offer & Create Answer</button>

  <h3>2. Copy this answer and paste it back into the tankstream.exe terminal</h3>
  <textarea id="answer" readonly placeholder="Answer will appear here..."></textarea>

  <script>
    const video = document.getElementById('video');
    const offerBox = document.getElementById('offer');
    const answerBox = document.getElementById('answer');
    const applyBtn = document.getElementById('apply');

    applyBtn.onclick = async () => {
      const offerSdp = offerBox.value.trim();
      if (!offerSdp) {
        alert('Paste the SDP offer first');
        return;
      }

      try {
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        pc.ontrack = (ev) => {
          console.log('Received track:', ev.track.kind);
          const stream = ev.streams[0] || new MediaStream([ev.track]);
          video.srcObject = stream;

          // Low-latency hints
          try { ev.track.contentHint = 'motion'; } catch (e) {}
          try { ev.track.playoutDelayHint = 0; } catch (e) {}
        };

        pc.oniceconnectionstatechange = () => {
          console.log('ICE state:', pc.iceConnectionState);
        };

        pc.onconnectionstatechange = () => {
          console.log('Connection state:', pc.connectionState);
        };

        await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        // Give ICE a moment to gather
        await new Promise(r => setTimeout(r, 800));
        answerBox.value = pc.localDescription.sdp;
        answerBox.select();
        console.log('Answer ready – copy it into the native terminal');
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    };
  </script>
</body>
</html>
