<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TankStream Receiver (legacy browser)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    video { width: 100%; background: #111; border-radius: 8px; }
    textarea { width: 100%; height: 140px; font-family: monospace; font-size: 12px; }
    button { padding: 10px 18px; margin: 10px 0; cursor: pointer; }
  </style>
</head>
<body>
  <h1>TankStream — Browser Receiver (legacy)</h1>
  <p>Prefer <code>tankstream-ui.exe</code> Receiver mode. This page is a fallback.</p>
  <video id="video" autoplay playsinline muted></video>
  <h3>1. Paste SDP offer</h3>
  <textarea id="offer" placeholder="Paste offer…"></textarea>
  <br>
  <button id="apply">Apply Offer & Create Answer</button>
  <h3>2. Copy answer back to Sender</h3>
  <textarea id="answer" readonly></textarea>
  <script>
    const video = document.getElementById('video');
    const offerBox = document.getElementById('offer');
    const answerBox = document.getElementById('answer');
    document.getElementById('apply').onclick = async () => {
      const offerSdp = offerBox.value.trim();
      if (!offerSdp) { alert('Paste offer first'); return; }
      const pc = new RTCPeerConnection({ iceServers: [] }); // LAN only
      pc.ontrack = (ev) => {
        video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
        try { ev.track.contentHint = 'motion'; } catch (e) {}
        try { ev.track.playoutDelayHint = 0; } catch (e) {}
      };
      pc.oniceconnectionstatechange = () => console.log('ICE:', pc.iceConnectionState);
      await pc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await new Promise(r => setTimeout(r, 800));
      answerBox.value = pc.localDescription.sdp;
    };
  </script>
</body>
</html>
